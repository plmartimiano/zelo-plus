-family="DejaVu Sans, Arial" font-size="14" fill="#f9fafb" font-weight="bold" text-anchor="end">3V3</text><rect x="1170" y="300" width="300" height="470" rx="10" fill="#1e40af" stroke="#111" stroke-width="2"/><text x="1320.0" y="254" font-family="DejaVu Sans, Arial" font-size="20" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Tela TFT 2,25"</text><text x="1320.0" y="278" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="middle">vista do verso (lado dos nomes)</text><circle cx="1200" cy="350" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="356" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">GND</text><circle cx="1200" cy="402" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="408" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">VCC</text><circle cx="1200" cy="454" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="460" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">SCL</text><circle cx="1200" cy="506" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="512" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">SDA</text><circle cx="1200" cy="558" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="564" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">RST</text><circle cx="1200" cy="610" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="616" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">DC</text><circle cx="1200" cy="662" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="668" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">CS</text><circle cx="1200" cy="714" r="8" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="1222" y="720" font-family="DejaVu Sans, Arial" font-size="18" fill="white" font-weight="bold" text-anchor="start">BL</text><polyline points="798,950 1095,950 1095,350 1200,350" fill="none" stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="798" cy="950" r="8" fill="#111111" stroke="#111" stroke-width="1.5"/><circle cx="1200" cy="350" r="8" fill="#111111" stroke="#111" stroke-width="1.5"/><polyline points="798,990 1120,990 1120,402 1200,402" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="798" cy="990" r="8" fill="#dc2626" stroke="#111" stroke-width="1.5"/><circle cx="1200" cy="402" r="8" fill="#dc2626" stroke="#111" stroke-width="1.5"/><polyline points="798,670 1020,670 1020,454 1200,454" fill="none" stroke="#eab308" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="798" cy="670" r="8" fill="#eab308" stroke="#111" stroke-width="1.5"/><circle cx="1200" cy="454" r="8" fill="#eab308" stroke="#111" stroke-width="1.5"/><polyline points="798,430 995,430 995,506 1200,506" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="798" cy="430" r="8" fill="#2563eb" stroke="#111" stroke-width="1.5"/><circle cx="1200" cy="506" r="8" fill="#2563eb" stroke="#111" stroke-width="1.5"/><polyline points="798,750 1045,750 1045,558 1200,558" fill="none" stroke="#9333ea" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="798" cy="750" r="8" fill="#9333ea" stroke="#111" stroke-width="1.5"/><circle cx="1200" cy="558" r="8" fill="#9333ea" stroke="#111" stroke-width="1.5"/><polyline points="798,790 1070,790 1070,610 1200,610" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="798" cy="790" r="8" fill="#16a34a" stroke="#111" stroke-width="1.5"/><circle cx="1200" cy="610" r="8" fill="#16a34a" stroke="#111" stroke-width="1.5"/><polyline points="542,750 320,750 320,1150 1140,1150 1140,662 1200,662" fill="none" stroke="#f97316" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="542" cy="750" r="8" fill="#f97316" stroke="#111" stroke-width="1.5"/><text x="332" y="742" font-family="DejaVu Sans, Arial" font-size="14" fill="#f97316" font-weight="bold" text-anchor="start">D26 (GPIO 26)</text><circle cx="1200" cy="662" r="8" fill="#f97316" stroke="#111" stroke-width="1.5"/><polyline points="542,710 290,710 290,1176 1158,1176 1158,714 1200,714" fill="none" stroke="#92400e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="542" cy="710" r="8" fill="#92400e" stroke="#111" stroke-width="1.5"/><text x="302" y="702" font-family="DejaVu Sans, Arial" font-size="14" fill="#92400e" font-weight="bold" text-anchor="start">D25 (GPIO 25)</text><circle cx="1200" cy="714" r="8" fill="#92400e" stroke="#111" stroke-width="1.5"/><text x="40" y="150" font-family="DejaVu Sans, Arial" font-size="19" fill="#1e3a8a" font-weight="bold" text-anchor="start">Tela  →  ESP32</text><rect x="40" y="170" width="22" height="16" fill="#111111" stroke="#111" stroke-width="1"/><text x="72" y="184" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">GND  →  GND</text><rect x="40" y="200" width="22" height="16" fill="#dc2626" stroke="#111" stroke-width="1"/><text x="72" y="214" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">VCC  →  3V3</text><rect x="40" y="230" width="22" height="16" fill="#eab308" stroke="#111" stroke-width="1"/><text x="72" y="244" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">SCL  →  D18</text><rect x="40" y="260" width="22" height="16" fill="#2563eb" stroke="#111" stroke-width="1"/><text x="72" y="274" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">SDA  →  D23</text><rect x="40" y="290" width="22" height="16" fill="#9333ea" stroke="#111" stroke-width="1"/><text x="72" y="304" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">RST  →  TX2 (GPIO 17)</text><rect x="40" y="320" width="22" height="16" fill="#16a34a" stroke="#111" stroke-width="1"/><text x="72" y="334" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">DC  →  RX2 (GPIO 16)</text><rect x="40" y="350" width="22" height="16" fill="#f97316" stroke="#111" stroke-width="1"/><text x="72" y="364" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">CS  →  D26</text><rect x="40" y="380" width="22" height="16" fill="#92400e" stroke="#111" stroke-width="1"/><text x="72" y="394" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="normal" text-anchor="start">BL  →  D25</text><text x="40" y="450" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="start">TX2 e RX2 são os nomes</text><text x="40" y="470" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="start">impressos para GPIO 17 e 16.</text><text x="40" y="500" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="start">Pinos em cinza já são usados</text><text x="40" y="520" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="start">pelo Zelo+ (não mexer).</text><text x="40" y="550" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="start">SCL e SDA da tela são do SPI,</text><text x="40" y="570" font-family="DejaVu Sans, Arial" font-size="14" fill="#374151" font-weight="normal" text-anchor="start">não vão no D21/D22 do LCD.</text></svg>