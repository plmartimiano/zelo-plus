<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220"><rect width="1500" height="1220" fill="white"/><text x="750.0" y="46" font-family="DejaVu Sans, Arial" font-size="28" fill="#1e3a8a" font-weight="bold" text-anchor="middle">Ligação da tela TFT 2,25" (ST7789P3) ao ESP32 DevKit V1 (30 pinos)</text><text x="750.0" y="78" font-family="DejaVu Sans, Arial" font-size="17" fill="#374151" font-weight="normal" text-anchor="middle">Vista de cima da placa: antena para cima, conector USB para baixo. Desligue o USB antes de ligar os fios.</text><rect x="520" y="130" width="300" height="960" rx="14" fill="#1f2937" stroke="#111" stroke-width="2"/><rect x="610" y="140" width="120" height="70" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/><text x="670" y="182" font-family="DejaVu Sans, Arial" font-size="15" fill="#111" font-weight="normal" text-anchor="middle">antena</text><rect x="590" y="240" width="160" height="150" rx="4" fill="#d1d5db" stroke="#4b5563" stroke-width="1.5"/><text x="670" y="310" font-family="DejaVu Sans, Arial" font-size="22" fill="#111" font-weight="bold" text-anchor="middle">ESP32</text><text x="670" y="336" font-family="DejaVu Sans, Arial" font-size="15" fill="#111" font-weight="normal" text-anchor="middle">WROOM-32</text><rect x="635" y="1050" width="70" height="50" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/><text x="670" y="1126" font-family="DejaVu Sans, Arial" font-size="16" fill="#111" font-weight="bold" text-anchor="middle">USB</text><circle cx="542" cy="430" r="7" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><circle cx="798" cy="430" r="7" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/><text x="558" y="435" font-family="DejaVu Sans, Arial" font-size="14" fill="#f9fafb" font-weight="bold" text-anchor="start">EN</text><text x="782" y="435" font-family="DejaVu Sans, Arial" font-size="14" fill="#f9fafb" font-weight="bold" text-anchor="end">D23</text><circle cx="542" cy="470" r="7" fil