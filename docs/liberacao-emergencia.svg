<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><rect width="1600" height="640" fill="#ffffff"/><text x="40" y="48" font-size="26" fill="#1e3a8a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Zelo+ — Abertura de emergência sem energia (esquemático, sem escala)</text><text x="40" y="80" font-size="16" fill="#374151" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">A tampa da área técnica abre sem ferramenta; o cuidador solta o servo da tampa do compartimento e abre com a mão.</text><circle cx="66" cy="132" r="20" fill="#1e3a8a" stroke="none" stroke-width="0"/><text x="66" y="139" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">1</text><text x="96" y="139" font-size="19" fill="#1e3a8a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Destravar a tampa técnica</text><rect x="60" y="200" width="460" height="150" rx="6" fill="#4b5563" stroke="#111827" stroke-width="2"/><circle cx="85" cy="222" r="8" fill="#9ca3af" stroke="#111" stroke-width="1.5"/><circle cx="85" cy="328" r="8" fill="#9ca3af" stroke="#111" stroke-width="1.5"/><circle cx="495" cy="222" r="8" fill="#9ca3af" stroke="#111" stroke-width="1.5"/><circle cx="495" cy="328" r="8" fill="#9ca3af" stroke="#111" stroke-width="1.5"/><text x="290" y="236" font-size="15" fill="#e5e7eb" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">tampa da área técnica</text><circle cx="290" cy="290" r="24" fill="#d1d5db" stroke="#111" stroke-width="2"/><rect x="276" y="287" width="28" height="6" rx="2" fill="#111827" stroke="none" stroke-width="0"/><path d="M 322 268 A 34 34 0 0 1 318 316" fill="none" stroke="#b91c1c" stroke-width="3"/><polygon points="318,316 310,304 326,306" fill="#b91c1c"/><rect x="245" y="342" width="90" height="16" rx="8" fill="#374151" stroke="none" stroke-width="0"/><circle cx="160" cy="420" r="26" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><text x="160" y="426" font-size="13" fill="#78350f" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">moeda</text><line x1="190" y1="405" x2="260" y2="320" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/><polygon points="260,320 256.2,335.5 245.5,326.7" fill="#b91c1c"/><text x="290" y="470" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Girar a trava 1/4 de volta com uma moeda</text><text x="290" y="492" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">e levantar a tampa pelo rebaixo para o dedo.</text><text x="290" y="520" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">4 ímãs mantêm a tampa fechada no dia a dia.</text><circle cx="586" cy="132" r="20" fill="#1e3a8a" stroke="none" stroke-width="0"/><text x="586" y="139" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">2</text><text x="616" y="139" font-size="19" fill="#1e3a8a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Tirar o pino com argola</text><rect x="620" y="300" width="110" height="150" rx="8" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2"/><text x="675" y="385" font-size="15" fill="#581c87" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">servo</text><circle cx="675" cy="300" r="9" fill="#6b21a8" stroke="none" stroke-width="0"/><line x1="675" y1="300" x2="800" y2="230" stroke="#c4b5fd" stroke-width="18" stroke-linecap="round"/><line x1="675" y1="300" x2="800" y2="230" stroke="#6b21a8" stroke-width="2" stroke-linecap="round"/><rect x="790" y="221" width="170" height="18" rx="9" fill="#475569" stroke="#111" stroke-width="2"/><text x="890" y="206" font-size="13" fill="#111" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">alavanca da tampa</text><text x="690" y="250" font-size="13" fill="#581c87" font-weight="bold" text-anchor="end" font-family="DejaVu Sans, sans-serif">braço do servo</text><circle cx="800" cy="230" r="6" fill="#ffffff" stroke="#111" stroke-width="2"/><rect x="860" y="300" width="70" height="8" rx="3" fill="#64748b" stroke="#111" stroke-width="1.5"/><circle cx="950" cy="304" r="18" fill="none" stroke="#b91c1c" stroke-width="4"/><text x="905" y="340" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">pino com argola</text><line x1="812" y1="244" x2="860" y2="292" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/><polygon points="860,292 844.9,286.7 854.7,276.9" fill="#b91c1c"/><text x="800" y="470" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Com a tampa técnica aberta, puxar pela argola</text><text x="800" y="492" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">o pino que liga o braço do servo à alavanca.</text><text x="800" y="520" font-size="14" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Braço e alavanca ficam lado a lado: soltos, não se tocam.</text><circle cx="1106" cy="132" r="20" fill="#1e3a8a" stroke="none" stroke-width="0"/><text x="1106" y="139" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">3</text><text x="1136" y="139" font-size="19" fill="#1e3a8a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Abrir e depois remontar</text><rect x="1120" y="350" width="300" height="90" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="1270" y="400" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">compartimento</text><g transform="rotate(35 1420 346)"><rect x="1120" y="338" width="300" height="14" rx="3" fill="#1f2937" stroke="none" stroke-width="0"/></g><circle cx="1420" cy="346" r="8" fill="#9ca3af" stroke="#111" stroke-width="2"/><line x1="1140" y1="270" x2="1140" y2="215" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/><polygon points="1140,215 1147.0,229.4 1133.0,229.4" fill="#b91c1c"/><text x="1310" y="470" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Levantar a tampa do compartimento com a mão.</text><text x="1310" y="498" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Para remontar: fechar a tampa, alinhar os furos,</text><text x="1310" y="520" font-size="15" fill="#111" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">recolocar o pino e fechar a tampa técnica.</text><text x="800.0" y="600" font-size="15" fill="#166534" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">O servo, parado, permanece na posição de porta fechada; ao recolocar o pino, os furos já estão alinhados.</text></svg>