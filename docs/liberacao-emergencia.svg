<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><rect width="1600" height="820" fill="#ffffff"/><text x="40" y="48" font-size="26" fill="#1e3a8a" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">Zelo+ — Liberação manual de emergência (corte lateral esquemático, sem escala)</text><text x="40" y="80" font-size="16" fill="#374151" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">Um pino com mola liga o braço do servo à alavanca da tampa. Empurrado por um furo na tampa da área técnica, solta a tampa sem forçar o servo.</text><text x="400" y="130" font-size="20" fill="#166534" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Uso normal (pino engatado)</text><g transform="translate(0,110)"><rect x="60" y="160" width="700" height="520" rx="10" fill="#f8fafc" stroke="#1e3a8a" stroke-width="3" /><rect x="80" y="230" width="380" height="300" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="2" /><text x="270" y="400" font-size="16" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">compartimento</text><text x="270" y="422" font-size="16" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">do remédio</text><rect x="470" y="230" width="10" height="300" rx="0" fill="#6b7280" stroke="none" stroke-width="0" /><text x="625" y="520" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">área técnica</text><rect x="485" y="196" width="270" height="12" rx="0" fill="#374151" stroke="none" stroke-width="0" /><rect x="580" y="196" width="10" height="12" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="680" y="190" font-size="13" fill="#374151" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">tampa técnica</text><rect x="85" y="206" width="390" height="14" rx="3" fill="#1f2937" stroke="none" stroke-width="0" /><polygon points="475,214 595,252 595,266 475,230" fill="#475569"/><circle cx="585" cy="258" r="7" fill="#ffffff" stroke="#111" stroke-width="2"/><circle cx="475" cy="214" r="9" fill="#9ca3af" stroke="#111" stroke-width="2"/><text x="461" y="196" font-size="13" fill="#374151" font-weight="normal" text-anchor="end" font-family="DejaVu Sans, sans-serif">dobradiça</text><text x="220" y="198" font-size="14" fill="#111" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">tampa do compartimento</text><rect x="560" y="330" width="80" height="120" rx="6" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2" /><text x="600" y="400" font-size="14" fill="#581c87" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">servo</text><polygon points="600,330 575,272 597,272 615,330" fill="#c4b5fd" stroke="#6b21a8" stroke-width="2"/><rect x="581" y="236" width="8" height="44" rx="0" fill="#64748b" stroke="#111" stroke-width="1.5" /><line x1="576" y1="282" x2="594" y2="285" stroke="#0f766e" stroke-width="2"/><line x1="576" y1="288" x2="594" y2="291" stroke="#0f766e" stroke-width="2"/><line x1="576" y1="294" x2="594" y2="297" stroke="#0f766e" stroke-width="2"/><line x1="576" y1="300" x2="594" y2="303" stroke="#0f766e" stroke-width="2"/><line x1="576" y1="306" x2="594" y2="309" stroke="#0f766e" stroke-width="2"/><text x="641" y="298" font-size="13" fill="#0f766e" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">pino com mola</text><text x="641" y="316" font-size="13" fill="#0f766e" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">(engatado)</text><line x1="595" y1="288" x2="637" y2="294" stroke="#0f766e" stroke-width="1.5"/><text x="400" y="640" font-size="15" fill="#166534" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Uso normal: o servo gira o braço, que empurra a alavanca e abre a tampa.</text><text x="400" y="662" font-size="15" fill="#166534" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Um furo de 2,5 mm na tampa técnica fica logo acima do pino.</text></g><text x="1190" y="130" font-size="20" fill="#b91c1c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Sem energia: liberação manual</text><g transform="translate(0,110)"><rect x="850" y="160" width="700" height="520" rx="10" fill="#f8fafc" stroke="#1e3a8a" stroke-width="3" /><rect x="870" y="230" width="380" height="300" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="2" /><text x="1060" y="400" font-size="16" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">compartimento</text><text x="1060" y="422" font-size="16" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">do remédio</text><rect x="1260" y="230" width="10" height="300" rx="0" fill="#6b7280" stroke="none" stroke-width="0" /><text x="1415" y="520" font-size="15" fill="#475569" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">área técnica</text><rect x="1275" y="196" width="270" height="12" rx="0" fill="#374151" stroke="none" stroke-width="0" /><rect x="1370" y="196" width="10" height="12" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><text x="1470" y="190" font-size="13" fill="#374151" font-weight="normal" text-anchor="start" font-family="DejaVu Sans, sans-serif">tampa técnica</text><g transform="rotate(30 1265 214)"><rect x="875" y="206" width="390" height="14" rx="3" fill="#1f2937" stroke="none" stroke-width="0" /><polygon points="1265,214 1385,252 1385,266 1265,230" fill="#475569"/><circle cx="1375" cy="258" r="7" fill="#ffffff" stroke="#111" stroke-width="2"/></g><circle cx="1265" cy="214" r="9" fill="#9ca3af" stroke="#111" stroke-width="2"/><text x="1251" y="248" font-size="13" fill="#374151" font-weight="normal" text-anchor="end" font-family="DejaVu Sans, sans-serif">dobradiça</text><text x="1080" y="330" font-size="14" fill="#111" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">tampa aberta à mão</text><rect x="1350" y="330" width="80" height="120" rx="6" fill="#e9d5ff" stroke="#6b21a8" stroke-width="2" /><text x="1390" y="400" font-size="14" fill="#581c87" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans, sans-serif">servo</text><polygon points="1390,330 1365,272 1387,272 1405,330" fill="#c4b5fd" stroke="#6b21a8" stroke-width="2"/><rect x="1371" y="268" width="8" height="44" rx="0" fill="#64748b" stroke="#111" stroke-width="1.5" /><line x1="1366" y1="314" x2="1384" y2="316" stroke="#0f766e" stroke-width="2"/><line x1="1366" y1="318" x2="1384" y2="320" stroke="#0f766e" stroke-width="2"/><line x1="1366" y1="322" x2="1384" y2="324" stroke="#0f766e" stroke-width="2"/><line x1="1366" y1="326" x2="1384" y2="328" stroke="#0f766e" stroke-width="2"/><path d="M 1375 150 L 1375 266" stroke="#b91c1c" stroke-width="4" fill="none"/><path d="M 1375 150 q 0 -24 18 -24 q 18 0 18 24 l 0 30" stroke="#b91c1c" stroke-width="4" fill="none"/><text x="1419" y="150" font-size="14" fill="#b91c1c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans, sans-serif">clipe pelo furo Ø 2,5</text><text x="1190" y="640" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Emergência: o clipe empurra o pino, a alavanca se solta do braço do servo</text><text x="1190" y="662" font-size="15" fill="#b91c1c" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans, sans-serif">e a tampa abre com a mão. Ao fechar a tampa, o pino volta a engatar sozinho.</text></g></svg>