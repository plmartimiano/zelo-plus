[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Porta especifica da maquina de desenvolvimento (Gerenciador de Dispositivos ->
; "Silicon Labs CP210x USB to UART Bridge"). Ajuste ou comente para autodeteccao.
upload_port = COM3
monitor_speed = 115200
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    madhephaestus/ESP32Servo@^3.0.5
