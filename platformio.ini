[platformio]
; Ambiente gravado pelo Build/Upload normal. Para testar a tela TFT, escolha
; "env:teste-tela" na barra inferior do VS Code (seletor de ambiente).
; esp32c5 = placa nova (GOOUUU ESP32-C5, modulo ESPC5-32 N16R8, Wi-Fi 2,4 e 5 GHz).
; esp32dev = placa anterior (ESP32 DevKit), mantida para consulta.
default_envs = esp32c5

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Porta especifica da maquina de desenvolvimento (Gerenciador de Dispositivos ->
; "Silicon Labs CP210x USB to UART Bridge"). Ajuste ou comente para autodeteccao.
upload_port = COM3
monitor_speed = 115200
; Mais espaco para o programa (HTTPS/Telegram e JSON aumentam o firmware). Sem OTA.
; A particao NVS nao muda, entao Wi-Fi e cadastro salvos sao mantidos.
board_build.partitions = huge_app.csv
; O programa de teste da tela fica fora do firmware do Zelo+.
build_src_filter = +<*> -<teste_tela.cpp>
lib_deps = 
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.0.4
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.11
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

; ESP32-C5: a plataforma oficial ainda nao suporta o C5; usa a "pioarduino"
; (Arduino 3.3 / ESP-IDF 5.5). Gravar pela porta USB-C marcada "TTL".
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<teste_tela.cpp>
lib_deps = ${env:esp32dev.lib_deps}

; Teste da tela TFT 2,25" (ST7789P3, 76x284): grava so src/teste_tela.cpp.
[env:teste-tela]
extends = env:esp32dev
build_src_filter = +<teste_tela.cpp>
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.11
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
